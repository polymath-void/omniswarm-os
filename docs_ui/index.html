<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic DocGen — Minimalist Living Architecture</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <!-- React 18 & Babel Standalone for Instant Zero-Build Portability -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #090d13;
      --bg-secondary: #131822;
      --bg-tertiary: #1c2333;
      --border-color: #273142;
      --border-light: #37445c;
      --text-primary: #f0f6fc;
      --text-secondary: #8fa0b5;
      --text-muted: #5e6f85;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #root { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      letter-spacing: 0.3px;
    }
    .badge-class { background: rgba(168, 85, 247, 0.12); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.25); }
    .badge-function { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
    .badge-method { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
    .badge-module { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
    pre, code { font-family: var(--font-mono); }
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 40;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      const [manifest, setManifest] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState('overview');
      const [activeSymbolId, setActiveSymbolId] = useState(null);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);

      useEffect(() => {
        fetch('./docs_manifest.json')
          .then(res => {
            if (!res.ok) throw new Error(`HTTP error ${res.status}`);
            return res.json();
          })
          .then(data => {
            setManifest(data);
            setLoading(false);
            const first = Object.values(data.symbols || {}).find(s => s.type === 'class' || s.type === 'function');
            if (first) setActiveSymbolId(first.full_name || first.id);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
            e.preventDefault();
            setIsSearchOpen(true);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const selectSymbol = (symId) => {
        let target = symId;
        if (manifest?.symbols && !manifest.symbols[symId]) {
          const match = Object.values(manifest.symbols).find(s => s.name === symId);
          if (match) target = match.full_name || match.id;
        }
        setActiveSymbolId(target);
        setActiveTab('symbols');
        setIsSidebarOpen(false);
      };

      if (loading) {
        return (
          <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-secondary)', fontFamily: 'var(--font-mono)', fontSize: '13px' }}>
            ⚡ Bootstrapping Living AST Manifest...
          </div>
        );
      }

      if (error) {
        return (
          <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--accent-red)', flexDirection: 'column', gap: '10px', padding: '20px', textAlign: 'center' }}>
            <div style={{ fontSize: '20px' }}>⚠️ {error}</div>
            <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Run: <code>docgen build</code></div>
          </div>
        );
      }

      const activeSymbol = manifest?.symbols ? manifest.symbols[activeSymbolId] : null;

      return (
        <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          {/* Responsive Header */}
          <header style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 16px', height: '54px',
            background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border-color)', userSelect: 'none', flexShrink: 0, gap: '10px', zIndex: 20
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexShrink: 0 }}>
              <button
                onClick={() => setIsSidebarOpen(prev => !prev)}
                style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'center', width: '32px', height: '32px',
                  background: isSidebarOpen ? 'var(--bg-tertiary)' : 'transparent', border: '1px solid var(--border-color)',
                  borderRadius: '6px', color: 'var(--text-primary)', cursor: 'pointer', padding: 0
                }}
              >
                <svg style={{ width: '16px', height: '16px' }} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <div style={{
                  background: 'linear-gradient(135deg, #3b82f6, #a855f7)', borderRadius: '6px', width: '24px', height: '24px',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', color: '#fff', fontSize: '12px'
                }}>⚡</div>
                <span style={{ fontWeight: 700, fontSize: '14px' }}>DocGen</span>
                <span style={{ fontSize: '11px', color: 'var(--text-muted)', fontFamily: 'var(--font-mono)', maxWidth: '100px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {manifest?.project?.name}
                </span>
              </div>
            </div>

            {/* Scrollable Center Tabs */}
            <div className="no-scrollbar" style={{ display: 'flex', gap: '4px', overflowX: 'auto', flex: 1, justifyContent: 'center', padding: '2px 0' }}>
              {[
                { id: 'overview', label: 'Overview' },
                { id: 'symbols', label: 'Symbols' },
                { id: 'graph', label: 'Graph' },
                { id: 'runner', label: 'Sandbox' }
              ].map(t => {
                const isAct = activeTab === t.id;
                return (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    style={{
                      padding: '5px 12px', fontSize: '12px', fontWeight: isAct ? 600 : 500,
                      background: isAct ? 'var(--bg-tertiary)' : 'transparent',
                      color: isAct ? 'var(--text-primary)' : 'var(--text-secondary)',
                      border: isAct ? '1px solid var(--border-color)' : '1px solid transparent',
                      borderRadius: '6px', cursor: 'pointer', whiteSpace: 'nowrap'
                    }}
                  >{t.label}</button>
                );
              })}
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexShrink: 0 }}>
              <button
                onClick={() => setIsSearchOpen(true)}
                style={{
                  display: 'flex', alignItems: 'center', gap: '6px', padding: '5px 10px',
                  background: 'var(--bg-primary)', border: '1px solid var(--border-color)',
                  borderRadius: '6px', color: 'var(--text-secondary)', fontSize: '12px', cursor: 'pointer'
                }}
              >
                <span>Search</span>
                <kbd style={{ background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', borderRadius: '4px', padding: '1px 4px', fontSize: '10px' }}>/</kbd>
              </button>
            </div>
          </header>

          {/* Main Body */}
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden', position: 'relative' }}>
            <Sidebar
              symbols={manifest?.symbols}
              activeId={activeSymbolId}
              onSelect={selectSymbol}
              isOpen={isSidebarOpen}
              onClose={() => setIsSidebarOpen(false)}
            />

            {activeTab === 'overview' && (
              <OverviewTab
                project={manifest?.project}
                symbols={manifest?.symbols}
                setActiveTab={setActiveTab}
                onSelect={selectSymbol}
              />
            )}

            {activeTab === 'symbols' && (
              <SymbolDetail
                symbol={activeSymbol}
                onSelect={selectSymbol}
              />
            )}

            {activeTab === 'graph' && (
              <GraphTab
                graph={manifest?.graph}
                onSelect={selectSymbol}
              />
            )}

            {activeTab === 'runner' && (
              <CodeRunnerTab
                symbol={activeSymbol}
              />
            )}
          </div>

          {/* Search Modal */}
          {isSearchOpen && (
            <SearchPopup
              onClose={() => setIsSearchOpen(false)}
              index={manifest?.search_index}
              onSelect={selectSymbol}
            />
          )}
        </div>
      );
    }

    /* Responsive Sidebar Drawer */
    function Sidebar({ symbols, activeId, onSelect, isOpen, onClose }) {
      const [filter, setFilter] = useState('');
      const list = useMemo(() => Object.values(symbols || {}), [symbols]);
      const filtered = list.filter(s => {
        if (!filter) return true;
        const q = filter.toLowerCase();
        return (s.name?.toLowerCase().includes(q) || s.file?.toLowerCase().includes(q));
      });

      const isMobile = typeof window !== 'undefined' && window.innerWidth < 1024;

      return (
        <React.Fragment>
          {isOpen && isMobile && (
            <div onClick={onClose} className="drawer-backdrop" />
          )}
          <aside style={{
            width: '280px', background: 'var(--bg-secondary)', borderRight: '1px solid var(--border-color)',
            display: 'flex', flexDirection: 'column', height: '100%', flexShrink: 0,
            position: isMobile ? 'fixed' : 'relative', top: 0, bottom: 0, left: 0, zIndex: isMobile ? 50 : 10,
            transform: isMobile && !isOpen ? 'translateX(-100%)' : 'translateX(0)',
            transition: 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)',
            boxShadow: isMobile && isOpen ? '0 10px 30px rgba(0,0,0,0.5)' : 'none'
          }}>
            <div style={{ padding: '12px', borderBottom: '1px solid var(--border-color)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                <span style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase', fontWeight: 600 }}>Symbols ({list.length})</span>
                {isMobile && (
                  <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: 'var(--text-secondary)', cursor: 'pointer', fontSize: '14px' }}>✕</button>
                )}
              </div>
              <input
                type="text"
                placeholder="Filter symbols..."
                value={filter}
                onChange={e => setFilter(e.target.value)}
                style={{ width: '100%', padding: '6px 10px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', borderRadius: '6px', color: 'var(--text-primary)', fontSize: '12px', outline: 'none' }}
              />
            </div>
            <div style={{ flex: 1, overflowY: 'auto', padding: '6px' }}>
              {filtered.map(s => {
                const id = s.full_name || s.id;
                const isSel = id === activeId;
                return (
                  <div
                    key={id}
                    onClick={() => { onSelect(id); if (isMobile) onClose(); }}
                    style={{
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 8px', borderRadius: '6px',
                      cursor: 'pointer', marginBottom: '2px', background: isSel ? 'var(--bg-tertiary)' : 'transparent',
                      borderLeft: isSel ? '3px solid var(--accent-blue)' : '3px solid transparent'
                    }}
                  >
                    <div style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginRight: '6px' }}>
                      <div style={{ fontSize: '12px', fontFamily: 'var(--font-mono)', color: isSel ? 'var(--accent-blue)' : 'var(--text-primary)' }}>{s.name}</div>
                      <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{s.file}:{s.line || 1}</div>
                    </div>
                    <span className={`badge badge-${s.type}`}>{s.type}</span>
                  </div>
                );
              })}
            </div>
          </aside>
        </React.Fragment>
      );
    }

    /* Overview Tab */
    function OverviewTab({ project, symbols, setActiveTab, onSelect }) {
      const stats = project?.stats || {};
      const list = Object.values(symbols || {});
      const hotspots = list.filter(s => s.complexity && s.complexity > 1).sort((a,b) => (b.complexity||0) - (a.complexity||0)).slice(0, 6);

      return (
        <div style={{ flex: 1, overflowY: 'auto', padding: '20px clamp(16px, 3vw, 32px)', background: 'var(--bg-primary)' }}>
          <div style={{ background: 'linear-gradient(135deg, rgba(59,130,246,0.08), rgba(168,85,247,0.05))', border: '1px solid var(--border-color)', borderRadius: '12px', padding: 'clamp(16px, 3vw, 24px)', marginBottom: '20px' }}>
            <div style={{ fontSize: '11px', textTransform: 'uppercase', color: 'var(--accent-blue)', fontWeight: 700, marginBottom: '6px' }}>Living AST Manifest</div>
            <h1 style={{ fontSize: 'clamp(20px, 4vw, 26px)', fontWeight: 800, marginBottom: '6px' }}>{project?.name} System Architecture</h1>
            <p style={{ color: 'var(--text-secondary)', fontSize: '13px', lineHeight: 1.5 }}>Self-extracting, continuous AST documentation with sub-second Merkle caching and WebAssembly sandbox.</p>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))', gap: '12px', marginBottom: '24px' }}>
            {[
              { label: 'Files', value: stats.total_files || 0, color: 'var(--text-primary)' },
              { label: 'Lines of Code', value: (stats.total_loc || 0).toLocaleString(), color: 'var(--accent-blue)' },
              { label: 'Classes', value: stats.total_classes || 0, color: 'var(--accent-purple)' },
              { label: 'Functions', value: stats.total_functions || 0, color: 'var(--accent-green)' },
              { label: 'Avg Complexity', value: stats.avg_complexity || 1.0, color: stats.avg_complexity > 5 ? 'var(--accent-red)' : 'var(--accent-green)' }
            ].map((m, idx) => (
              <div key={idx} style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '12px 14px' }}>
                <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '4px' }}>{m.label}</div>
                <div style={{ fontSize: '18px', fontWeight: 700, color: m.color, fontFamily: 'var(--font-mono)' }}>{m.value}</div>
              </div>
            ))}
          </div>

          <div style={{ marginBottom: '24px' }}>
            <h2 style={{ fontSize: '14px', fontWeight: 700, marginBottom: '12px' }}>🔥 Logic Complexity Hotspots</h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '10px' }}>
              {hotspots.map((h, i) => (
                <div key={i} onClick={() => { onSelect(h.full_name || h.id); setActiveTab('symbols'); }} style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '10px 14px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div style={{ overflow: 'hidden', marginRight: '8px' }}>
                    <div style={{ fontSize: '12px', fontWeight: 600, fontFamily: 'var(--font-mono)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{h.name}</div>
                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{h.file}:{h.line || 1}</div>
                  </div>
                  <span style={{ fontSize: '11px', fontFamily: 'var(--font-mono)', color: h.complexity > 6 ? 'var(--accent-red)' : 'var(--accent-yellow)', background: 'rgba(255,255,255,0.04)', padding: '2px 6px', borderRadius: '4px', border: '1px solid var(--border-color)', whiteSpace: 'nowrap' }}>
                    Score: {h.complexity}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* Symbol Detail View */
    function SymbolDetail({ symbol, onSelect }) {
      const [copied, setCopied] = useState(false);
      if (!symbol) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)', fontSize: '13px' }}>Select a symbol to inspect</div>;

      const copySig = () => {
        navigator.clipboard.writeText(symbol.signature || symbol.name);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div style={{ flex: 1, overflowY: 'auto', padding: '20px clamp(16px, 3vw, 32px)', background: 'var(--bg-primary)' }}>
          <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'flex-start', gap: '12px', marginBottom: '16px', paddingBottom: '16px', borderBottom: '1px solid var(--border-color)' }}>
            <div>
              <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
                <span className={`badge badge-${symbol.type}`}>{symbol.type}</span>
                <span style={{ fontSize: '11px', color: 'var(--text-secondary)', fontFamily: 'var(--font-mono)' }}>{symbol.file}:{symbol.line || 1}</span>
                {symbol.complexity && (
                  <span style={{ fontSize: '11px', fontFamily: 'var(--font-mono)', color: symbol.complexity > 5 ? 'var(--accent-yellow)' : 'var(--accent-green)', padding: '1px 6px', border: '1px solid var(--border-color)', borderRadius: '4px' }}>
                    Complexity: {symbol.complexity}
                  </span>
                )}
              </div>
              <h1 style={{ fontSize: 'clamp(18px, 4vw, 24px)', fontWeight: 700, fontFamily: 'var(--font-mono)', wordBreak: 'break-all' }}>{symbol.name}</h1>
            </div>
            <button onClick={copySig} style={{ padding: '5px 12px', fontSize: '12px', background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '6px', color: '#fff', cursor: 'pointer' }}>
              {copied ? '✅ Copied' : '📋 Copy Signature'}
            </button>
          </div>

          {symbol.signature && (
            <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '14px', marginBottom: '18px' }}>
              <div style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: '6px', fontWeight: 600 }}>Signature</div>
              <pre style={{ color: 'var(--accent-blue)', fontSize: '12px' }}><code>{symbol.signature}</code></pre>
            </div>
          )}

          {symbol.docstring && (
            <div style={{ marginBottom: '20px' }}>
              <h3 style={{ fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '8px', textTransform: 'uppercase' }}>Documentation</h3>
              <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '14px', fontSize: '13px', lineHeight: 1.6, whiteSpace: 'pre-wrap' }}>{symbol.docstring}</div>
            </div>
          )}

          {symbol.enriched && (
            <div style={{ marginBottom: '20px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
              <div style={{ background: 'rgba(59, 130, 246, 0.08)', border: '1px solid rgba(59, 130, 246, 0.3)', borderRadius: '8px', padding: '14px' }}>
                <div style={{ fontSize: '11px', color: 'var(--accent-blue)', textTransform: 'uppercase', marginBottom: '6px', fontWeight: 600 }}>🌟 Purpose & Conceptual Role</div>
                <div style={{ fontSize: '13px', lineHeight: 1.6, color: '#f0f6fc' }}>{symbol.enriched.purpose}</div>
              </div>

              <div style={{ background: 'rgba(168, 85, 247, 0.08)', border: '1px solid rgba(168, 85, 247, 0.3)', borderRadius: '8px', padding: '14px' }}>
                <div style={{ fontSize: '11px', color: 'var(--accent-purple)', textTransform: 'uppercase', marginBottom: '6px', fontWeight: 600 }}>🏛️ Architecture & Call Graph Role</div>
                <div style={{ fontSize: '12px', lineHeight: 1.6, color: 'var(--text-secondary)' }}>{symbol.enriched.architecture_role}</div>
              </div>

              {symbol.enriched.usage_recipe && (
                <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '14px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                    <div style={{ fontSize: '11px', color: 'var(--accent-green)', textTransform: 'uppercase', fontWeight: 600 }}>💻 Usage Recipe</div>
                    <button onClick={() => { navigator.clipboard.writeText(symbol.enriched.usage_recipe); alert('Recipe copied!'); }} style={{ padding: '3px 8px', fontSize: '11px', background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', borderRadius: '4px', color: '#fff', cursor: 'pointer' }}>
                      📋 Copy Recipe
                    </button>
                  </div>
                  <pre style={{ fontSize: '12px', color: 'var(--accent-green)', overflowX: 'auto', background: 'var(--bg-primary)', padding: '10px', borderRadius: '6px' }}>
                    <code>{symbol.enriched.usage_recipe}</code>
                  </pre>
                </div>
              )}

              {symbol.enriched.mermaid_flow && (
                <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '14px' }}>
                  <div style={{ fontSize: '11px', color: 'var(--accent-yellow)', textTransform: 'uppercase', marginBottom: '6px', fontWeight: 600 }}>📊 Interaction Sequence</div>
                  <pre style={{ fontSize: '11px', fontFamily: 'var(--font-mono)', color: 'var(--text-secondary)', background: 'var(--bg-primary)', padding: '10px', borderRadius: '6px', overflowX: 'auto' }}>
                    <code>{symbol.enriched.mermaid_flow}</code>
                  </pre>
                </div>
              )}
            </div>
          )}


          {symbol.args && symbol.args.length > 0 && (
            <div style={{ marginBottom: '20px' }}>
              <h3 style={{ fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '8px', textTransform: 'uppercase' }}>Parameters</h3>
              <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px', minWidth: '320px' }}>
                  <thead>
                    <tr style={{ background: 'var(--bg-tertiary)', borderBottom: '1px solid var(--border-color)', textAlign: 'left' }}>
                      <th style={{ padding: '8px 12px' }}>Name</th>
                      <th style={{ padding: '8px 12px' }}>Type</th>
                    </tr>
                  </thead>
                  <tbody>
                    {symbol.args.map((a, i) => (
                      <tr key={i} style={{ borderBottom: '1px solid var(--border-color)' }}>
                        <td style={{ padding: '8px 12px', fontFamily: 'var(--font-mono)', color: 'var(--accent-purple)' }}>{a.name}</td>
                        <td style={{ padding: '8px 12px', fontFamily: 'var(--font-mono)', color: 'var(--accent-green)' }}>{a.type}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '12px', marginBottom: '20px' }}>
            <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '12px' }}>
              <h4 style={{ fontSize: '11px', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '8px' }}>Calls Made ({symbol.calls?.length || 0})</h4>
              {(!symbol.calls || symbol.calls.length === 0) ? <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>None</span> : (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px' }}>
                  {symbol.calls.map((c, i) => (
                    <span key={i} onClick={() => onSelect(c)} style={{ background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', padding: '2px 7px', borderRadius: '4px', fontSize: '11px', fontFamily: 'var(--font-mono)', color: 'var(--accent-blue)', cursor: 'pointer' }}>{c}()</span>
                  ))}
                </div>
              )}
            </div>

            <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '12px' }}>
              <h4 style={{ fontSize: '11px', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '8px' }}>Referenced By ({symbol.callers?.length || 0})</h4>
              {(!symbol.callers || symbol.callers.length === 0) ? <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>None</span> : (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px' }}>
                  {symbol.callers.map((c, i) => (
                    <span key={i} onClick={() => onSelect(c)} style={{ background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', padding: '2px 7px', borderRadius: '4px', fontSize: '11px', fontFamily: 'var(--font-mono)', color: 'var(--accent-purple)', cursor: 'pointer' }}>{c.split(':').pop()}</span>
                  ))}
                </div>
              )}
            </div>
          </div>

          {symbol.source && (
            <div>
              <h3 style={{ fontSize: '12px', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '8px' }}>Source (Lines {symbol.line} - {symbol.end_line || symbol.line})</h3>
              <pre style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '14px', fontSize: '12px', maxHeight: '380px', overflowY: 'auto' }}>
                <code>{symbol.source}</code>
              </pre>
            </div>
          )}
        </div>
      );
    }

    /* Graph Tab */
    function GraphTab({ graph, onSelect }) {
      const nodes = graph?.nodes || [];
      const edges = (graph?.edges || []).slice(0, 60);

      const positions = useMemo(() => {
        const pos = {};
        const activeIds = new Set();
        edges.forEach(e => { activeIds.add(e.source); activeIds.add(e.target); });
        const list = nodes.filter(n => activeIds.has(n.id)).slice(0, 36);
        const count = list.length;
        const radius = Math.min(240, 40 + count * 7);
        list.forEach((n, i) => {
          const angle = (i / Math.max(count, 1)) * 2 * Math.PI;
          pos[n.id] = { x: 360 + radius * Math.cos(angle), y: 300 + radius * Math.sin(angle), ...n };
        });
        return pos;
      }, [nodes, edges]);

      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: 'var(--bg-primary)' }}>
          <div style={{ flex: 1, position: 'relative' }}>
            <svg viewBox="0 0 720 600" style={{ width: '100%', height: '100%' }}>
              {edges.map((e, i) => {
                const s = positions[e.source];
                const d = positions[e.target];
                if (!s || !d) return null;
                return <line key={i} x1={s.x} y1={s.y} x2={d.x} y2={d.y} stroke="#273142" strokeWidth="1" opacity="0.6" />;
              })}
              {Object.values(positions).map(n => (
                <g key={n.id} transform={`translate(${n.x}, ${n.y})`} onClick={() => onSelect(n.id)} style={{ cursor: 'pointer' }}>
                  <circle r="9" fill={n.type === 'class' ? '#a855f7' : n.type === 'module' ? '#f59e0b' : '#3b82f6'} stroke="#090d13" strokeWidth="2" />
                  <text x="13" y="4" fill="#8fa0b5" fontSize="10px" fontFamily="monospace">{n.name}</text>
                </g>
              ))}
            </svg>
          </div>
        </div>
      );
    }

    /* Scratchpad Tab (Responsive Stacked/Split Grid) */
    function CodeRunnerTab({ symbol }) {
      const [code, setCode] = useState(`# Test code for ${symbol?.name || 'DocGen'}\nprint("⚡ WebAssembly Python Runner Online")\nfor i in range(1, 4):\n    print(f"Step {i}: Verification OK")\n`);
      const [output, setOutput] = useState('Click "▶ Run Code" to execute Python in-browser via Pyodide Wasm...');
      const [running, setRunning] = useState(false);

      const isMobile = typeof window !== 'undefined' && window.innerWidth < 768;

      const run = async () => {
        setRunning(true);
        setOutput('⏳ Bootstrapping Pyodide WebAssembly runtime...\n');
        try {
          if (!window.loadPyodide && !window.__pyodide_instance) {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js';
            document.head.appendChild(script);
            await new Promise((res, rej) => { script.onload = res; script.onerror = rej; });
          }
          if (!window.__pyodide_instance) {
            window.__pyodide_instance = await window.loadPyodide({
              stdout: (t) => setOutput(prev => prev + t + '\n'),
              stderr: (t) => setOutput(prev => prev + '[ERR] ' + t + '\n')
            });
          }
          setOutput(prev => prev + '▶ Executing:\n------------------\n');
          const t0 = performance.now();
          const r = await window.__pyodide_instance.runPythonAsync(code);
          const dt = ((performance.now() - t0) / 1000).toFixed(3);
          if (r !== undefined) setOutput(prev => prev + `[Return]: ${r}\n`);
          setOutput(prev => prev + `\n✅ Finished in ${dt}s`);
        } catch (e) {
          setOutput(prev => prev + `\n❌ Error: ${e.message}`);
        } finally {
          setRunning(false);
        }
      };

      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '10px 16px', background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: '13px', fontWeight: 600 }}>🐍 Python Sandbox</span>
            <button onClick={run} disabled={running} style={{ padding: '5px 14px', background: 'var(--accent-green)', color: '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 600, fontSize: '12px' }}>
              {running ? 'Running...' : '▶ Run Code'}
            </button>
          </div>
          <div style={{ flex: 1, display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gridTemplateRows: isMobile ? '1fr 1fr' : '1fr' }}>
            <textarea value={code} onChange={e => setCode(e.target.value)} spellCheck="false" style={{ background: 'var(--bg-primary)', color: 'var(--text-primary)', border: 'none', borderRight: isMobile ? 'none' : '1px solid var(--border-color)', borderBottom: isMobile ? '1px solid var(--border-color)' : 'none', padding: '14px', fontFamily: 'var(--font-mono)', fontSize: '12px', outline: 'none' }} />
            <pre style={{ background: '#06090e', color: '#34d399', padding: '14px', margin: 0, border: 'none', fontSize: '12px', whiteSpace: 'pre-wrap', overflowY: 'auto' }}>{output}</pre>
          </div>
        </div>
      );
    }

    /* Search Popup */
    function SearchPopup({ onClose, index, onSelect }) {
      const [query, setQuery] = useState('');
      const results = (index || []).filter(item => {
        if (!query) return true;
        const q = query.toLowerCase();
        return item.name?.toLowerCase().includes(q) || item.file?.toLowerCase().includes(q);
      }).slice(0, 10);

      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(3px)', display: 'flex', justifyContent: 'center', paddingTop: '60px', paddingLeft: '16px', paddingRight: '16px', zIndex: 9999 }}>
          <div onClick={e => e.stopPropagation()} style={{ width: '560px', maxWidth: '100%', background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '12px', overflow: 'hidden' }}>
            <div style={{ padding: '10px 14px', borderBottom: '1px solid var(--border-color)', display: 'flex', gap: '10px', alignItems: 'center' }}>
              <input autoFocus type="text" placeholder="Search symbols..." value={query} onChange={e => setQuery(e.target.value)} style={{ flex: 1, background: 'transparent', border: 'none', color: '#fff', fontSize: '14px', outline: 'none' }} />
              <kbd style={{ fontSize: '11px', background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', padding: '2px 6px', borderRadius: '4px' }}>ESC</kbd>
            </div>
            <div style={{ maxHeight: '340px', overflowY: 'auto', padding: '6px' }}>
              {results.map(r => (
                <div key={r.id} onClick={() => { onSelect(r.id); onClose(); }} style={{ padding: '8px 10px', borderRadius: '6px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div style={{ overflow: 'hidden', marginRight: '8px' }}>
                    <div style={{ fontSize: '12px', fontWeight: 600, fontFamily: 'var(--font-mono)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.name}</div>
                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{r.file}:{r.line}</div>
                  </div>
                  <span className={`badge badge-${r.type}`}>{r.type}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
