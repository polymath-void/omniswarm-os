<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic DocGen — OmniSwarm Living Architecture</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <!-- React 18 & Babel Standalone for Instant Zero-Build Portability -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border-color: #30363d;
      --border-light: #484f58;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-purple: #bc8cff;
      --accent-yellow: #d29922;
      --accent-red: #f85149;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      overflow: hidden;
      height: 100vh;
    }
    #root { height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .badge-class { background: rgba(188, 140, 255, 0.15); color: var(--accent-purple); border: 1px solid rgba(188, 140, 255, 0.3); }
    .badge-function { background: rgba(88, 166, 255, 0.15); color: var(--accent-blue); border: 1px solid rgba(88, 166, 255, 0.3); }
    .badge-method { background: rgba(63, 185, 80, 0.15); color: var(--accent-green); border: 1px solid rgba(63, 185, 80, 0.3); }
    .badge-module { background: rgba(210, 153, 34, 0.15); color: var(--accent-yellow); border: 1px solid rgba(210, 153, 34, 0.3); }
    pre, code { font-family: var(--font-mono); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      const [manifest, setManifest] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState('overview');
      const [activeSymbolId, setActiveSymbolId] = useState(null);
      const [isSearchOpen, setIsSearchOpen] = useState(false);

      useEffect(() => {
        fetch('./docs_manifest.json')
          .then(res => {
            if (!res.ok) throw new Error(`HTTP error ${res.status}`);
            return res.json();
          })
          .then(data => {
            setManifest(data);
            setLoading(false);
            const first = Object.values(data.symbols || {}).find(s => s.type === 'class' || s.type === 'function');
            if (first) setActiveSymbolId(first.full_name || first.id);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
            e.preventDefault();
            setIsSearchOpen(true);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const selectSymbol = (symId) => {
        let target = symId;
        if (manifest?.symbols && !manifest.symbols[symId]) {
          const match = Object.values(manifest.symbols).find(s => s.name === symId);
          if (match) target = match.full_name || match.id;
        }
        setActiveSymbolId(target);
        setActiveTab('symbols');
      };

      if (loading) {
        return (
          <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-secondary)', fontFamily: 'var(--font-mono)' }}>
            ⚡ Bootstrapping Living AST Manifest...
          </div>
        );
      }

      if (error) {
        return (
          <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--accent-red)', flexDirection: 'column', gap: '10px' }}>
            <div style={{ fontSize: '20px' }}>⚠️ {error}</div>
            <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Run: <code>python docgen_cli.py build</code></div>
          </div>
        );
      }

      const activeSymbol = manifest?.symbols ? manifest.symbols[activeSymbolId] : null;

      return (
        <div style={{ height: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Header */}
          <header style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 20px', height: '56px',
            background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border-color)', userSelect: 'none', flexShrink: 0
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <div style={{
                background: 'linear-gradient(135deg, #58a6ff, #bc8cff)', borderRadius: '8px', width: '28px', height: '28px',
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', color: '#fff', fontSize: '14px'
              }}>⚡</div>
              <div>
                <span style={{ fontWeight: 700, fontSize: '15px' }}>Dynamic DocGen</span>
                <span style={{ marginLeft: '8px', fontSize: '12px', color: 'var(--text-secondary)', fontFamily: 'var(--font-mono)' }}>
                  {manifest?.project?.name}
                </span>
              </div>
            </div>

            <div style={{ display: 'flex', gap: '4px' }}>
              {[
                { id: 'overview', label: '📊 Overview' },
                { id: 'symbols', label: '🔍 Symbols' },
                { id: 'graph', label: '🕸️ Architecture Graph' },
                { id: 'runner', label: '▶️ Live Scratchpad' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  style={{
                    padding: '6px 14px', fontSize: '13px', fontWeight: 500,
                    background: activeTab === t.id ? 'var(--bg-tertiary)' : 'transparent',
                    color: activeTab === t.id ? 'var(--text-primary)' : 'var(--text-secondary)',
                    border: activeTab === t.id ? '1px solid var(--border-color)' : '1px solid transparent',
                    borderRadius: '6px', cursor: 'pointer'
                  }}
                >{t.label}</button>
              ))}
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <button
                onClick={() => setIsSearchOpen(true)}
                style={{
                  display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 12px',
                  background: 'var(--bg-primary)', border: '1px solid var(--border-color)',
                  borderRadius: '6px', color: 'var(--text-secondary)', fontSize: '12px', cursor: 'pointer', minWidth: '180px', justifyContent: 'space-between'
                }}
              >
                <span>Find symbol...</span>
                <kbd style={{ background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', borderRadius: '4px', padding: '1px 5px', fontSize: '10px' }}>/</kbd>
              </button>
              <span style={{ fontSize: '11px', color: 'var(--accent-green)', fontFamily: 'var(--font-mono)', background: 'rgba(63, 185, 80, 0.1)', padding: '3px 8px', borderRadius: '4px', border: '1px solid rgba(63, 185, 80, 0.2)' }}>
                v1.0.0
              </span>
            </div>
          </header>

          {/* Body */}
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            {(activeTab === 'symbols' || activeTab === 'graph') && (
              <Sidebar
                symbols={manifest?.symbols}
                activeId={activeSymbolId}
                onSelect={selectSymbol}
              />
            )}

            {activeTab === 'overview' && (
              <OverviewTab
                project={manifest?.project}
                symbols={manifest?.symbols}
                setActiveTab={setActiveTab}
                onSelect={selectSymbol}
              />
            )}

            {activeTab === 'symbols' && (
              <SymbolDetail
                symbol={activeSymbol}
                onSelect={selectSymbol}
              />
            )}

            {activeTab === 'graph' && (
              <GraphTab
                graph={manifest?.graph}
                onSelect={selectSymbol}
              />
            )}

            {activeTab === 'runner' && (
              <CodeRunnerTab
                symbol={activeSymbol}
              />
            )}
          </div>

          {/* Search Modal */}
          {isSearchOpen && (
            <SearchPopup
              onClose={() => setIsSearchOpen(false)}
              index={manifest?.search_index}
              onSelect={selectSymbol}
            />
          )}
        </div>
      );
    }

    /* Sidebar Component */
    function Sidebar({ symbols, activeId, onSelect }) {
      const [filter, setFilter] = useState('');
      const list = useMemo(() => Object.values(symbols || {}), [symbols]);
      const filtered = list.filter(s => {
        if (!filter) return true;
        const q = filter.toLowerCase();
        return (s.name?.toLowerCase().includes(q) || s.file?.toLowerCase().includes(q));
      });

      return (
        <aside style={{ width: '280px', background: 'var(--bg-secondary)', borderRight: '1px solid var(--border-color)', display: 'flex', flexDirection: 'column', height: '100%', flexShrink: 0 }}>
          <div style={{ padding: '12px', borderBottom: '1px solid var(--border-color)' }}>
            <input
              type="text"
              placeholder="Filter tree..."
              value={filter}
              onChange={e => setFilter(e.target.value)}
              style={{ width: '100%', padding: '6px 10px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', borderRadius: '6px', color: 'var(--text-primary)', fontSize: '12px', outline: 'none' }}
            />
          </div>
          <div style={{ flex: 1, overflowY: 'auto', padding: '6px' }}>
            {filtered.map(s => {
              const id = s.full_name || s.id;
              const isSel = id === activeId;
              return (
                <div
                  key={id}
                  onClick={() => onSelect(id)}
                  style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 8px', borderRadius: '6px',
                    cursor: 'pointer', marginBottom: '2px', background: isSel ? 'var(--bg-tertiary)' : 'transparent',
                    borderLeft: isSel ? '3px solid var(--accent-blue)' : '3px solid transparent'
                  }}
                >
                  <div style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginRight: '6px' }}>
                    <div style={{ fontSize: '12px', fontFamily: 'var(--font-mono)' }}>{s.name}</div>
                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{s.file}:{s.line || 1}</div>
                  </div>
                  <span className={`badge badge-${s.type}`}>{s.type}</span>
                </div>
              );
            })}
          </div>
        </aside>
      );
    }

    /* Overview Tab */
    function OverviewTab({ project, symbols, setActiveTab, onSelect }) {
      const stats = project?.stats || {};
      const list = Object.values(symbols || {});
      const hotspots = list.filter(s => s.complexity && s.complexity > 1).sort((a,b) => (b.complexity||0) - (a.complexity||0)).slice(0, 6);

      return (
        <div style={{ flex: 1, overflowY: 'auto', padding: '32px', background: 'var(--bg-primary)' }}>
          <div style={{ background: 'linear-gradient(135deg, rgba(88,166,255,0.1), rgba(188,140,255,0.1))', border: '1px solid var(--border-color)', borderRadius: '12px', padding: '24px', marginBottom: '28px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px' }}>
              <span>⚡</span>
              <span style={{ fontSize: '12px', textTransform: 'uppercase', color: 'var(--accent-blue)', fontWeight: 700 }}>Living AST Architectural Manifest</span>
            </div>
            <h1 style={{ fontSize: '28px', fontWeight: 800, marginBottom: '8px' }}>{project?.name} System Architecture</h1>
            <p style={{ color: 'var(--text-secondary)', fontSize: '14px' }}>Self-extracting, continuous AST semantic documentation engine with zero-backend static portability.</p>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '16px', marginBottom: '32px' }}>
            {[
              { label: 'Total Files', value: stats.total_files || 0, icon: '📁', color: 'var(--accent-yellow)' },
              { label: 'Lines of Code', value: (stats.total_loc || 0).toLocaleString(), icon: '📝', color: 'var(--accent-blue)' },
              { label: 'Classes Parsed', value: stats.total_classes || 0, icon: '🏛️', color: 'var(--accent-purple)' },
              { label: 'Functions & Methods', value: stats.total_functions || 0, icon: '⚡', color: 'var(--accent-green)' },
              { label: 'Avg Complexity', value: stats.avg_complexity || 1.0, icon: '🧩', color: stats.avg_complexity > 5 ? 'var(--accent-red)' : 'var(--accent-green)' }
            ].map((m, idx) => (
              <div key={idx} style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '16px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                  <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{m.label}</span>
                  <span>{m.icon}</span>
                </div>
                <div style={{ fontSize: '22px', fontWeight: 700, color: m.color, fontFamily: 'var(--font-mono)' }}>{m.value}</div>
              </div>
            ))}
          </div>

          <div style={{ marginBottom: '32px' }}>
            <h2 style={{ fontSize: '16px', fontWeight: 700, marginBottom: '14px' }}>🔥 Critical Logic Hotspots (Complexity)</h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '12px' }}>
              {hotspots.map((h, i) => (
                <div key={i} onClick={() => { onSelect(h.full_name || h.id); setActiveTab('symbols'); }} style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '12px 16px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <div style={{ fontSize: '13px', fontWeight: 600, fontFamily: 'var(--font-mono)' }}>{h.name}</div>
                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>{h.file}:{h.line || 1}</div>
                  </div>
                  <span style={{ fontSize: '11px', fontFamily: 'var(--font-mono)', color: h.complexity > 10 ? 'var(--accent-red)' : 'var(--accent-yellow)', background: 'rgba(255,255,255,0.05)', padding: '2px 8px', borderRadius: '4px', border: '1px solid var(--border-color)' }}>
                    Score: {h.complexity}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* Symbol Detail View */
    function SymbolDetail({ symbol, onSelect }) {
      const [copied, setCopied] = useState(false);
      if (!symbol) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' }}>Select a symbol to inspect</div>;

      const copySig = () => {
        navigator.clipboard.writeText(symbol.signature || symbol.name);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div style={{ flex: 1, overflowY: 'auto', padding: '24px 32px', background: 'var(--bg-primary)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
                <span className={`badge badge-${symbol.type}`}>{symbol.type}</span>
                <span style={{ fontSize: '12px', color: 'var(--text-secondary)', fontFamily: 'var(--font-mono)' }}>{symbol.file}:{symbol.line || 1}</span>
                {symbol.complexity && (
                  <span style={{ fontSize: '11px', fontFamily: 'var(--font-mono)', color: symbol.complexity > 5 ? 'var(--accent-yellow)' : 'var(--accent-green)', padding: '2px 6px', border: '1px solid var(--border-color)', borderRadius: '4px' }}>
                    Complexity: {symbol.complexity}
                  </span>
                )}
              </div>
              <h1 style={{ fontSize: '24px', fontWeight: 700, fontFamily: 'var(--font-mono)' }}>{symbol.name}</h1>
            </div>
            <button onClick={copySig} style={{ padding: '6px 12px', fontSize: '12px', background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '6px', color: '#fff', cursor: 'pointer' }}>
              {copied ? '✅ Copied' : '📋 Copy Signature'}
            </button>
          </div>

          {symbol.signature && (
            <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '16px', marginBottom: '20px' }}>
              <div style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: '6px', fontWeight: 600 }}>Signature</div>
              <pre style={{ color: 'var(--accent-blue)', fontSize: '13px' }}><code>{symbol.signature}</code></pre>
            </div>
          )}

          {symbol.docstring && (
            <div style={{ marginBottom: '24px' }}>
              <h3 style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px', textTransform: 'uppercase' }}>Documentation</h3>
              <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '16px', fontSize: '13px', lineHeight: 1.6, whiteSpace: 'pre-wrap' }}>{symbol.docstring}</div>
            </div>
          )}

          {symbol.args && symbol.args.length > 0 && (
            <div style={{ marginBottom: '24px' }}>
              <h3 style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px', textTransform: 'uppercase' }}>Parameters</h3>
              <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', overflow: 'hidden' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                  <thead>
                    <tr style={{ background: 'var(--bg-tertiary)', borderBottom: '1px solid var(--border-color)', textAlign: 'left' }}>
                      <th style={{ padding: '8px 12px' }}>Name</th>
                      <th style={{ padding: '8px 12px' }}>Type</th>
                    </tr>
                  </thead>
                  <tbody>
                    {symbol.args.map((a, i) => (
                      <tr key={i} style={{ borderBottom: '1px solid var(--border-color)' }}>
                        <td style={{ padding: '8px 12px', fontFamily: 'var(--font-mono)', color: 'var(--accent-purple)' }}>{a.name}</td>
                        <td style={{ padding: '8px 12px', fontFamily: 'var(--font-mono)', color: 'var(--accent-green)' }}>{a.type}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '24px' }}>
            <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '14px' }}>
              <h4 style={{ fontSize: '12px', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '8px' }}>Calls Made ({symbol.calls?.length || 0})</h4>
              {(!symbol.calls || symbol.calls.length === 0) ? <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>None</span> : (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                  {symbol.calls.map((c, i) => (
                    <span key={i} onClick={() => onSelect(c)} style={{ background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', padding: '2px 8px', borderRadius: '4px', fontSize: '11px', fontFamily: 'var(--font-mono)', color: 'var(--accent-blue)', cursor: 'pointer' }}>{c}()</span>
                  ))}
                </div>
              )}
            </div>

            <div style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '14px' }}>
              <h4 style={{ fontSize: '12px', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '8px' }}>Referenced By ({symbol.callers?.length || 0})</h4>
              {(!symbol.callers || symbol.callers.length === 0) ? <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>None</span> : (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                  {symbol.callers.map((c, i) => (
                    <span key={i} onClick={() => onSelect(c)} style={{ background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', padding: '2px 8px', borderRadius: '4px', fontSize: '11px', fontFamily: 'var(--font-mono)', color: 'var(--accent-purple)', cursor: 'pointer' }}>{c.split(':').pop()}</span>
                  ))}
                </div>
              )}
            </div>
          </div>

          {symbol.source && (
            <div>
              <h3 style={{ fontSize: '13px', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '8px' }}>Source Code (Lines {symbol.line} - {symbol.end_line || symbol.line})</h3>
              <pre style={{ background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '8px', padding: '16px', fontSize: '12px', maxHeight: '400px', overflowY: 'auto' }}>
                <code>{symbol.source}</code>
              </pre>
            </div>
          )}
        </div>
      );
    }

    /* Graph Tab */
    function GraphTab({ graph, onSelect }) {
      const nodes = graph?.nodes || [];
      const edges = (graph?.edges || []).slice(0, 75);

      const positions = useMemo(() => {
        const pos = {};
        const activeIds = new Set();
        edges.forEach(e => { activeIds.add(e.source); activeIds.add(e.target); });
        const list = nodes.filter(n => activeIds.has(n.id)).slice(0, 45);
        const count = list.length;
        const radius = Math.min(260, 40 + count * 7);
        list.forEach((n, i) => {
          const angle = (i / Math.max(count, 1)) * 2 * Math.PI;
          pos[n.id] = { x: 380 + radius * Math.cos(angle), y: 320 + radius * Math.sin(angle), ...n };
        });
        return pos;
      }, [nodes, edges]);

      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: 'var(--bg-primary)' }}>
          <div style={{ flex: 1, position: 'relative' }}>
            <svg viewBox="0 0 760 640" style={{ width: '100%', height: '100%' }}>
              {edges.map((e, i) => {
                const s = positions[e.source];
                const d = positions[e.target];
                if (!s || !d) return null;
                return <line key={i} x1={s.x} y1={s.y} x2={d.x} y2={d.y} stroke="#30363d" strokeWidth="1" opacity="0.6" />;
              })}
              {Object.values(positions).map(n => (
                <g key={n.id} transform={`translate(${n.x}, ${n.y})`} onClick={() => onSelect(n.id)} style={{ cursor: 'pointer' }}>
                  <circle r="10" fill={n.type === 'class' ? '#bc8cff' : n.type === 'module' ? '#d29922' : '#58a6ff'} stroke="#0d1117" strokeWidth="2" />
                  <text x="14" y="4" fill="#c9d1d9" fontSize="10px" fontFamily="monospace">{n.name}</text>
                </g>
              ))}
            </svg>
          </div>
        </div>
      );
    }

    /* Scratchpad Tab */
    function CodeRunnerTab({ symbol }) {
      const [code, setCode] = useState(`# Test code for ${symbol?.name || 'OmniSwarm'}\nprint("⚡ WebAssembly Python Runner Online")\nfor i in range(1, 4):\n    print(f"Step {i}: Verification OK")\n`);
      const [output, setOutput] = useState('Click "▶ Run Code" to execute Python in-browser via Pyodide Wasm...');
      const [running, setRunning] = useState(false);

      const run = async () => {
        setRunning(true);
        setOutput('⏳ Bootstrapping Pyodide WebAssembly runtime...\n');
        try {
          if (!window.loadPyodide && !window.__pyodide_instance) {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js';
            document.head.appendChild(script);
            await new Promise((res, rej) => { script.onload = res; script.onerror = rej; });
          }
          if (!window.__pyodide_instance) {
            window.__pyodide_instance = await window.loadPyodide({
              stdout: (t) => setOutput(prev => prev + t + '\n'),
              stderr: (t) => setOutput(prev => prev + '[ERR] ' + t + '\n')
            });
          }
          setOutput(prev => prev + '▶ Executing:\n------------------\n');
          const t0 = performance.now();
          const r = await window.__pyodide_instance.runPythonAsync(code);
          const dt = ((performance.now() - t0) / 1000).toFixed(3);
          if (r !== undefined) setOutput(prev => prev + `[Return]: ${r}\n`);
          setOutput(prev => prev + `\n✅ Finished in ${dt}s`);
        } catch (e) {
          setOutput(prev => prev + `\n❌ Error: ${e.message}`);
        } finally {
          setRunning(false);
        }
      };

      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '12px 20px', background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border-color)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: '13px', fontWeight: 600 }}>🐍 In-Browser Python WebAssembly Runner</span>
            <button onClick={run} disabled={running} style={{ padding: '6px 16px', background: 'var(--accent-green)', color: '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 600 }}>
              {running ? 'Running...' : '▶ Run Code'}
            </button>
          </div>
          <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr' }}>
            <textarea value={code} onChange={e => setCode(e.target.value)} spellCheck="false" style={{ background: 'var(--bg-primary)', color: 'var(--text-primary)', border: 'none', borderRight: '1px solid var(--border-color)', padding: '16px', fontFamily: 'var(--font-mono)', fontSize: '13px', outline: 'none' }} />
            <pre style={{ background: '#090d13', color: '#a6e3a1', padding: '16px', margin: 0, border: 'none', fontSize: '12px', whiteSpace: 'pre-wrap', overflowY: 'auto' }}>{output}</pre>
          </div>
        </div>
      );
    }

    /* Search Popup */
    function SearchPopup({ onClose, index, onSelect }) {
      const [query, setQuery] = useState('');
      const results = (index || []).filter(item => {
        if (!query) return true;
        const q = query.toLowerCase();
        return item.name?.toLowerCase().includes(q) || item.file?.toLowerCase().includes(q);
      }).slice(0, 12);

      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', justifyContent: 'center', paddingTop: '80px', zIndex: 9999 }}>
          <div onClick={e => e.stopPropagation()} style={{ width: '600px', maxWidth: '90vw', background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: '12px', overflow: 'hidden' }}>
            <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--border-color)', display: 'flex', gap: '10px' }}>
              <input autoFocus type="text" placeholder="Search symbols..." value={query} onChange={e => setQuery(e.target.value)} style={{ flex: 1, background: 'transparent', border: 'none', color: '#fff', fontSize: '15px', outline: 'none' }} />
              <kbd style={{ fontSize: '11px', background: 'var(--bg-tertiary)', border: '1px solid var(--border-color)', padding: '2px 6px', borderRadius: '4px' }}>ESC</kbd>
            </div>
            <div style={{ maxHeight: '380px', overflowY: 'auto', padding: '8px' }}>
              {results.map(r => (
                <div key={r.id} onClick={() => { onSelect(r.id); onClose(); }} style={{ padding: '8px 12px', borderRadius: '6px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <div style={{ fontSize: '13px', fontWeight: 600, fontFamily: 'var(--font-mono)' }}>{r.name}</div>
                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>{r.file}:{r.line}</div>
                  </div>
                  <span className={`badge badge-${r.type}`}>{r.type}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
