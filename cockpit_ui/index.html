<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniSwarm Cockpit — Cybernetic Swarm Operations HUD</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <!-- React 18 & Babel Standalone for Instant Zero-Build Portability -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #06090e;
      --bg-secondary: #0b111a;
      --bg-card: #121926;
      --bg-card-hover: #172132;
      --border-color: #1e293b;
      --border-light: #2d3d57;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --cyan-neon: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.25);
      --green-neon: #10b981;
      --green-glow: rgba(16, 185, 129, 0.25);
      --purple-neon: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.25);
      --amber-neon: #f59e0b;
      --red-neon: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.45;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }
    #root { height: 100vh; display: flex; flex-direction: column; }

    /* Performance Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan-neon); }

    /* Top Matrix Header */
    .matrix-header {
      height: 48px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand-glow {
      color: var(--cyan-neon);
      text-shadow: 0 0 12px var(--cyan-glow);
      font-size: 14px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--green-neon);
      color: var(--green-neon);
      box-shadow: 0 0 8px var(--green-glow);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--red-neon);
      color: var(--red-neon);
      box-shadow: none;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .header-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-action {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font-mono);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      border-color: var(--cyan-neon);
      background: var(--bg-card-hover);
    }
    .btn-action.primary {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--cyan-neon);
      color: var(--cyan-neon);
    }

    /* 3-Column Responsive Layout */
    .cockpit-body {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      overflow: hidden;
      background: var(--bg-primary);
    }
    @media (max-width: 950px) {
      .cockpit-body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
      }
    }

    /* Left Sidebar: Host & Edge Vitals */
    .left-sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .vitals-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
    .vital-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .vital-label { color: var(--text-secondary); font-size: 11px; }
    .vital-val { font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); }
    .meter-bar {
      height: 5px;
      background: #06090e;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 3px;
    }
    .meter-fill {
      height: 100%;
      background: var(--cyan-neon);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* Center Panel: Dialogue Stream */
    .chat-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-primary);
      position: relative;
    }
    .room-tabs-bar {
      height: 40px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      flex-shrink: 0;
      overflow-x: auto;
    }
    .room-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .room-tab.active {
      background: var(--bg-card);
      color: var(--text-primary);
      font-weight: 600;
      border: 1px solid var(--border-color);
    }
    .room-tab.active.agy { color: var(--purple-neon); border-color: var(--purple-neon); }
    .room-tab.active.pc { color: var(--cyan-neon); border-color: var(--cyan-neon); }
    .room-tab.active.phone { color: var(--green-neon); border-color: var(--green-neon); }

    /* Messages List (No Lag) */
    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      contain: layout style;
    }
    .msg-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease;
      user-select: text;
    }
    .msg-card:hover {
      border-color: var(--border-light);
    }
    .msg-card.agy {
      border-left: 3px solid var(--purple-neon);
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.04) 0%, var(--bg-secondary) 100%);
    }
    .msg-card.pc {
      border-left: 3px solid var(--cyan-neon);
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.04) 0%, var(--bg-secondary) 100%);
    }
    .msg-card.phone {
      border-left: 3px solid var(--green-neon);
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.04) 0%, var(--bg-secondary) 100%);
    }

    .msg-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .msg-identity {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .msg-identity.agy { color: var(--purple-neon); }
    .msg-identity.pc { color: var(--cyan-neon); }
    .msg-identity.phone { color: var(--green-neon); }
    .badge-route {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .msg-time { color: var(--text-muted); }
    .msg-text-content {
      font-size: 13px;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    /* Generative UI Dynamic Cards */
    .card-diff-container {
      background: #020408;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      overflow-x: auto;
      max-height: 220px;
    }
    .diff-line-add { color: #34d399; background: rgba(16, 185, 129, 0.08); }
    .diff-line-del { color: #f87171; background: rgba(239, 68, 68, 0.08); }

    .card-terminal-container {
      background: #020408;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #38bdf8;
      overflow-x: auto;
      max-height: 180px;
    }

    .action-chips-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font-mono);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .chip-btn:hover {
      background: var(--border-color);
      color: var(--cyan-neon);
      border-color: var(--cyan-neon);
    }

    /* Floating Jump Button */
    .jump-bottom-btn {
      position: absolute;
      bottom: 60px;
      right: 20px;
      background: var(--cyan-neon);
      color: #040609;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
      cursor: pointer;
      border: none;
      z-index: 20;
    }

    /* Right Panel: Workflow & Ops Stream */
    .right-sidebar {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .workflow-box {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .pill-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      font-family: var(--font-mono);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .pill-pending { background: rgba(245, 158, 11, 0.15); color: var(--amber-neon); }
    .pill-running { background: rgba(6, 182, 212, 0.15); color: var(--cyan-neon); }
    .pill-completed { background: rgba(16, 185, 129, 0.15); color: var(--green-neon); }

    .ops-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px;
    }
    .ops-terminal {
      flex: 1;
      background: #020408;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-item { display: flex; gap: 6px; line-height: 1.35; }
    .log-INFO { color: var(--green-neon); }
    .log-WARN { color: var(--amber-neon); }
    .log-ERROR { color: var(--red-neon); }

    /* Bottom Command Bar */
    .bottom-command-bar {
      height: 48px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      flex-shrink: 0;
    }
    .input-target {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      outline: none;
    }
    .input-cmd {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
    }
    .input-cmd:focus { border-color: var(--cyan-neon); }
    .btn-send {
      background: var(--cyan-neon);
      border: none;
      color: #040609;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function CockpitApp() {
      const [state, setState] = useState({
        messages: [],
        logs: [],
        workflow: null,
        telemetry: {},
        node_status: {}
      });
      const [activeTab, setActiveTab] = useState("agy_pc"); // Default to exact Antigravity <-> PCAgent dialogue
      const [targetPeer, setTargetPeer] = useState("PCAgent");
      const [cmdText, setCmdText] = useState("");
      const [autoScroll, setAutoScroll] = useState(false);
      const [showJumpBtn, setShowJumpBtn] = useState(false);
      const [isSending, setIsSending] = useState(false);
      const scrollViewportRef = useRef(null);
      const prevMsgCountRef = useRef(0);

      // SSE Connection (Zero Tokens)
      useEffect(() => {
        const es = new EventSource("/api/stream");
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            setState(data);
          } catch (err) {}
        };
        return () => es.close();
      }, []);

      // Smart Scroll Handler (Zero Jank / Stutter)
      const handleScroll = () => {
        const el = scrollViewportRef.current;
        if (!el) return;
        const isNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
        setShowJumpBtn(!isNearBottom);
      };

      // Perform scroll only when autoScroll is toggled ON or user jumps
      const scrollToBottom = () => {
        const el = scrollViewportRef.current;
        if (el) {
          el.scrollTop = el.scrollHeight;
          setShowJumpBtn(false);
        }
      };

      useEffect(() => {
        if (autoScroll) {
          const el = scrollViewportRef.current;
          if (el) el.scrollTop = el.scrollHeight;
        }
      }, [state.messages, autoScroll]);

      // API Actions
      const sendAction = async (payload) => {
        setIsSending(true);
        try {
          await fetch("/api/action", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } catch (e) {}
        setIsSending(false);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!cmdText.trim()) return;
        const msg = cmdText.trim();
        setCmdText("");
        if (targetPeer === "swarm_dev") {
          sendAction({ room: "swarm_dev", message: msg });
        } else {
          sendAction({ target: targetPeer, message: msg });
        }
      };

      // Exact Message Filtering
      const messages = state.messages || [];
      const filtered = messages.filter((m) => {
        const s = (m.sender || "").toLowerCase();
        const r = (m.recipient || "").toLowerCase();
        if (activeTab === "all") return true;
        if (activeTab === "agy_pc") {
          // Exact Antigravity <-> PCAgent dialogue
          return (s.includes("antigravity") && r.includes("pc")) ||
                 (s.includes("pc") && r.includes("antigravity"));
        }
        if (activeTab === "phone_pc") {
          // Exact PhoneAgent <-> PCAgent dialogue
          return (s.includes("phone") && r.includes("pc")) ||
                 (s.includes("pc") && r.includes("phone"));
        }
        if (activeTab === "swarm_dev") {
          return m.room === "swarm_dev" || r === "*" || m.message?.startsWith("[swarm_dev]");
        }
        return true;
      });

      const node = state.node_status || {};
      const telem = state.telemetry || {};
      const battery = telem.battery || {};
      const isOnline = node.pc_hub_reachable;

      return (
        <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
          {/* Top Matrix Header */}
          <header className="matrix-header">
            <div className="header-brand">
              <span className="brand-glow">⚡ OMNISWARM COCKPIT</span>
              <div className={`status-badge ${isOnline ? "" : "offline"}`}>
                <span className="status-dot"></span>
                {isOnline ? "HUB ONLINE" : "HUB OFFLINE"}
              </div>
              {node.rtt_ms && (
                <span style={{ color: "var(--cyan-neon)" }}>RTT: {node.rtt_ms}ms</span>
              )}
              <span style={{ color: "var(--text-muted)" }}>Host: {telem.is_windows ? "PC Windows" : "Android Edge"}</span>
            </div>

            <div className="header-tools">
              <button 
                className={`btn-action ${autoScroll ? "primary" : ""}`}
                onClick={() => setAutoScroll(!autoScroll)}
              >
                📜 Auto-Scroll: {autoScroll ? "ON" : "OFF"}
              </button>

              <button 
                className="btn-action"
                onClick={() => sendAction({ target: "PCAgent", message: "ping", data: { action: "ping" } })}
              >
                🚀 Ping PC
              </button>
            </div>
          </header>

          {/* Main 3-Column Layout */}
          <main className="cockpit-body">
            {/* Left Column: Vitals */}
            <aside className="left-sidebar">
              <div className="section-title">
                <span>📊 Host Hardware Vitals</span>
              </div>
              <div className="vitals-card">
                <div className="vital-row">
                  <span className="vital-label">Host Device:</span>
                  <span className="vital-val">{telem.device_model || "Host"}</span>
                </div>
                <div className="vital-row">
                  <span className="vital-label">Processor SoC:</span>
                  <span className="vital-val" style={{ fontSize: "10px" }}>{telem.soc || "Multi-Core"}</span>
                </div>
                {battery.percentage !== undefined && (
                  <>
                    <div className="vital-row" style={{ marginTop: "6px" }}>
                      <span className="vital-label">Battery Level:</span>
                      <span className="vital-val">{battery.percentage}%</span>
                    </div>
                    <div className="meter-bar">
                      <div className="meter-fill" style={{ width: `${battery.percentage}%` }}></div>
                    </div>
                  </>
                )}
                <div className="vital-row" style={{ marginTop: "8px" }}>
                  <span className="vital-label">Memory Used:</span>
                  <span className="vital-val">{telem.ram_used_percent || 0}%</span>
                </div>
                <div className="meter-bar">
                  <div className="meter-fill" style={{ width: `${telem.ram_used_percent || 0}%` }}></div>
                </div>
                <div className="vital-row" style={{ marginTop: "4px" }}>
                  <span className="vital-label">RAM Free:</span>
                  <span className="vital-val">{telem.ram_available_mb || 0} MB</span>
                </div>
              </div>

              <div className="section-title">
                <span>🤖 Swarm Fleet Entities</span>
              </div>
              <div className="vitals-card" style={{ fontSize: "11px" }}>
                <div className="vital-row">
                  <span className="vital-label">🧠 Antigravity:</span>
                  <span className="vital-val" style={{ color: "var(--purple-neon)" }}>Cognitive Brain</span>
                </div>
                <div className="vital-row">
                  <span className="vital-label">🖥️ PCAgent:</span>
                  <span className="vital-val" style={{ color: "var(--cyan-neon)" }}>PC Coordinator</span>
                </div>
                <div className="vital-row">
                  <span className="vital-label">📱 PhoneAgent:</span>
                  <span className="vital-val" style={{ color: "var(--green-neon)" }}>Edge Node</span>
                </div>
              </div>

              <div className="section-title">
                <span>⚡ Quick Directives</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                <button className="btn-action" onClick={() => sendAction({ target: "PCAgent", message: "health", data: { action: "health_check" } })}>
                  📊 PC Health Check
                </button>
                <button className="btn-action" onClick={() => sendAction({ target: "PhoneAgent-Termux", message: "exec:git status -s" })}>
                  📋 Phone Git Status
                </button>
                <button className="btn-action" onClick={() => sendAction({ target: "PCAgent", message: "exec:git log -n 1 --oneline" })}>
                  📜 PC Git Log
                </button>
              </div>
            </aside>

            {/* Center Column: Formatted Exact Chat */}
            <section className="chat-panel">
              {/* Room & Conversation Selector Tabs */}
              <div className="room-tabs-bar">
                <button 
                  className={`room-tab agy ${activeTab === "agy_pc" ? "active" : ""}`}
                  onClick={() => setActiveTab("agy_pc")}
                >
                  🧠 Antigravity ↔ PCAgent
                </button>
                <button 
                  className={`room-tab phone ${activeTab === "phone_pc" ? "active" : ""}`}
                  onClick={() => setActiveTab("phone_pc")}
                >
                  📱 PhoneAgent ↔ PCAgent
                </button>
                <button 
                  className={`room-tab ${activeTab === "swarm_dev" ? "active" : ""}`}
                  onClick={() => setActiveTab("swarm_dev")}
                >
                  📡 Room: swarm_dev
                </button>
                <button 
                  className={`room-tab ${activeTab === "all" ? "active" : ""}`}
                  onClick={() => setActiveTab("all")}
                >
                  🌐 All Messages ({messages.length})
                </button>
              </div>

              {/* Viewport */}
              <div 
                className="messages-viewport" 
                ref={scrollViewportRef}
                onScroll={handleScroll}
              >
                {filtered.length === 0 ? (
                  <div style={{ textAlign: "center", color: "var(--text-muted)", marginTop: "40px", fontFamily: "var(--font-mono)" }}>
                    No messages in this channel yet.
                  </div>
                ) : (
                  filtered.map((m, idx) => {
                    const sender = m.sender || "Unknown";
                    const isAGY = sender.includes("Antigravity");
                    const isPC = sender.includes("PC");
                    const roleClass = isAGY ? "agy" : (isPC ? "pc" : "phone");
                    const icon = isAGY ? "🧠" : (isPC ? "🖥️" : "📱");
                    const text = m.message || m.content || "";
                    const data = m.data || {};

                    return (
                      <div key={m.id || idx} className={`msg-card ${roleClass}`}>
                        <div className="msg-meta-row">
                          <div className={`msg-identity ${roleClass}`}>
                            <span>{icon}</span>
                            <span>{sender}</span>
                            {m.recipient && (
                              <span className="badge-route">➔ {m.recipient}</span>
                            )}
                          </div>
                          <span className="msg-time">
                            {m.timestamp ? new Date(m.timestamp * 1000).toLocaleTimeString() : ""}
                          </span>
                        </div>

                        <div className="msg-text-content">{text}</div>

                        {/* Generative UI: Diff Inspector */}
                        {(data.diff || text.includes("diff --git") || text.includes("@@")) && (
                          <div className="card-diff-container">
                            <div style={{ color: "var(--text-muted)", marginBottom: "4px" }}>📄 Git Diff Stream</div>
                            {(data.diff || text).split("\n").map((line, li) => (
                              <div key={li} className={line.startsWith("+") ? "diff-line-add" : (line.startsWith("-") ? "diff-line-del" : "")}>
                                {line}
                              </div>
                            ))}
                          </div>
                        )}

                        {/* Generative UI: Shell Output */}
                        {(data.stdout || data.stderr || text.startsWith("Command '")) && (
                          <div className="card-terminal-container">
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "4px" }}>
                              <span>🖥️ Execution Result {data.returncode !== undefined ? `(Exit: ${data.returncode})` : ""}</span>
                              <span>{data.success ? "✅ SUCCESS" : "⚠️ NOTICE"}</span>
                            </div>
                            <pre style={{ margin: 0, whiteSpace: "pre-wrap" }}>
                              {data.stdout || data.stderr || "Output logged."}
                            </pre>
                          </div>
                        )}

                        {/* Generative UI: Smart Action Chips */}
                        <div className="action-chips-wrapper">
                          <span className="chip-btn" onClick={() => sendAction({ target: sender, message: "ping", data: { action: "ping" } })}>
                            ▶ Ping Node
                          </span>
                          <span className="chip-btn" onClick={() => sendAction({ target: sender, message: "health", data: { action: "health_check" } })}>
                            ▶ Query Health
                          </span>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {/* Jump to Latest Floating Button */}
              {showJumpBtn && (
                <button className="jump-bottom-btn" onClick={scrollToBottom}>
                  ↓ Jump to Latest
                </button>
              )}
            </section>

            {/* Right Column: Active Workflow & Real-Time Ops Stream */}
            <aside className="right-sidebar">
              {/* Workflow Pipeline */}
              <div className="workflow-box">
                <div className="section-title">
                  <span>⚡ Active Workflow Intent</span>
                </div>
                {state.workflow ? (
                  <div className="vitals-card">
                    <span className={`pill-status pill-${state.workflow.status || 'pending'}`}>
                      {state.workflow.status || "Pending"}
                    </span>
                    <div style={{ fontSize: "12px", fontWeight: "600", marginBottom: "4px" }}>
                      {state.workflow.intent || "No intent text"}
                    </div>
                    <div style={{ fontSize: "11px", color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
                      Task ID: {state.workflow.task_id || "N/A"}<br/>
                      Source: {state.workflow.source || "PCAgent"}
                    </div>
                  </div>
                ) : (
                  <div style={{ fontSize: "11px", color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
                    No pending tasks in workflow.json
                  </div>
                )}
              </div>

              {/* Real-Time Ops Terminal */}
              <div className="ops-box">
                <div className="section-title">
                  <span>🖥️ Real-time Ops Stream</span>
                  <span>{state.logs?.length || 0}</span>
                </div>
                <div className="ops-terminal">
                  {(state.logs || []).map((l, i) => (
                    <div key={l.id || i} className="log-item">
                      <span className={`log-${l.log_level || l.level || 'INFO'}`}>
                        [{l.log_level || l.level || 'INFO'}]
                      </span>
                      <span style={{ color: "var(--text-muted)" }}>[{l.agent_id}]</span>
                      <span style={{ color: "var(--text-primary)" }}>{l.message}</span>
                    </div>
                  ))}
                </div>
              </div>
            </aside>
          </main>

          {/* Bottom Command Bar */}
          <footer className="bottom-command-bar">
            <select 
              className="input-target"
              value={targetPeer} 
              onChange={(e) => setTargetPeer(e.target.value)}
            >
              <option value="PCAgent">Target: PCAgent</option>
              <option value="Antigravity">Target: Antigravity Brain</option>
              <option value="PhoneAgent-Termux">Target: PhoneAgent</option>
              <option value="swarm_dev">Room: swarm_dev</option>
            </select>

            <form onSubmit={handleFormSubmit} style={{ display: "flex", flex: 1, gap: "8px" }}>
              <input
                type="text"
                className="input-cmd"
                placeholder="Enter directive or message to dispatch over ZMQ..."
                value={cmdText}
                onChange={(e) => setCmdText(e.target.value)}
              />
              <button type="submit" className="btn-send" disabled={isSending}>
                {isSending ? "..." : "🚀 SEND"}
              </button>
            </form>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<CockpitApp />);
  </script>
</body>
</html>
