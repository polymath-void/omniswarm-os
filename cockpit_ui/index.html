<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniSwarm Cockpit — Cybernetic Agent Operations HUD</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <!-- React 18 & Babel Standalone for Instant Zero-Build Portability -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #070a0f;
      --bg-secondary: #0e131d;
      --bg-tertiary: #161c29;
      --border-color: #20293a;
      --border-light: #2e3a52;
      --text-primary: #f0f6fc;
      --text-secondary: #8fa0b5;
      --text-muted: #5e6f85;
      --cyan-neon: #06b6d4;
      --green-neon: #10b981;
      --purple-neon: #a855f7;
      --amber-neon: #f59e0b;
      --red-neon: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.4;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #root { height: 100vh; display: flex; flex-direction: column; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    /* Top Matrix Header */
    .matrix-header {
      height: 48px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      flex-shrink: 0;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-primary);
    }
    .brand-glow {
      color: var(--cyan-neon);
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--green-neon);
      color: var(--green-neon);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--red-neon);
      color: var(--red-neon);
    }
    .status-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    .btn-chip {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-chip:hover {
      background: var(--border-color);
      border-color: var(--cyan-neon);
    }
    .btn-chip.primary {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--cyan-neon);
      color: var(--cyan-neon);
    }
    .btn-chip.danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--red-neon);
      color: var(--red-neon);
    }

    /* Main Grid Layout */
    .cockpit-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      overflow: hidden;
      background: var(--bg-primary);
    }
    @media (max-width: 900px) {
      .cockpit-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
      }
    }

    /* Left Sidebar: Telemetry */
    .sidebar-panel {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px;
      gap: 14px;
    }
    .panel-title {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-vitals {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
    .vital-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .vital-label { color: var(--text-secondary); }
    .vital-value { font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); }
    .progress-bar-bg {
      height: 6px;
      background: var(--bg-primary);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--cyan-neon);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.green { background: var(--green-neon); }
    .progress-bar-fill.amber { background: var(--amber-neon); }
    .progress-bar-fill.red { background: var(--red-neon); }

    /* Center Panel: Dialogue Stream */
    .dialogue-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-primary);
    }
    .dialogue-filter-bar {
      height: 38px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      background: var(--bg-secondary);
      font-size: 12px;
      font-family: var(--font-mono);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--bg-tertiary);
      color: var(--cyan-neon);
      font-weight: 600;
    }
    .messages-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Message Bubble Cards */
    .msg-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s ease;
    }
    .msg-card.pc { border-left: 3px solid var(--cyan-neon); }
    .msg-card.phone { border-left: 3px solid var(--green-neon); }
    .msg-card.antigravity { border-left: 3px solid var(--purple-neon); }

    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-family: var(--font-mono);
    }
    .msg-sender {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .msg-sender.pc { color: var(--cyan-neon); }
    .msg-sender.phone { color: var(--green-neon); }
    .msg-sender.antigravity { color: var(--purple-neon); }
    .msg-time { color: var(--text-muted); }
    .msg-body {
      font-size: 13px;
      color: var(--text-primary);
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* Generative UI Widgets */
    .gen-widget {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .gen-widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .diff-block {
      background: #040609;
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      max-height: 200px;
      line-height: 1.4;
    }
    .diff-add { color: var(--green-neon); }
    .diff-del { color: var(--red-neon); }
    .terminal-block {
      background: #040609;
      color: #38bdf8;
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      max-height: 160px;
    }
    .action-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .chip-interactive {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .chip-interactive:hover {
      background: var(--border-color);
      color: var(--cyan-neon);
      border-color: var(--cyan-neon);
    }

    /* Right Panel: Workflows & Ops Stream */
    .right-panel {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .workflow-section {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .workflow-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }
    .workflow-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      font-family: var(--font-mono);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--amber-neon); }
    .status-running { background: rgba(6, 182, 212, 0.15); color: var(--cyan-neon); }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--green-neon); }

    .ops-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px;
    }
    .ops-stream {
      flex: 1;
      background: #040609;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-line { display: flex; gap: 6px; line-height: 1.3; }
    .log-level-INFO { color: var(--green-neon); }
    .log-level-WARN { color: var(--amber-neon); }
    .log-level-ERROR { color: var(--red-neon); }

    /* Bottom Command Bar */
    .command-bar {
      height: 48px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      flex-shrink: 0;
    }
    .target-select {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
    }
    .cmd-input {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
    }
    .cmd-input:focus { border-color: var(--cyan-neon); }
    .send-btn {
      background: var(--cyan-neon);
      border: none;
      color: #040609;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .send-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function CockpitApp() {
      const [state, setState] = useState({
        messages: [],
        logs: [],
        workflow: null,
        telemetry: {},
        node_status: {}
      });
      const [filter, setFilter] = useState("all");
      const [targetAgent, setTargetAgent] = useState("PCAgent");
      const [inputCmd, setInputCmd] = useState("");
      const [audioEnabled, setAudioEnabled] = useState(true);
      const [isSending, setIsSending] = useState(false);
      const messagesEndRef = useRef(null);
      const logsEndRef = useRef(null);

      // Web Audio API Synthetic Beep (0 external tokens/assets)
      const playChime = (freq = 880, duration = 0.08) => {
        if (!audioEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      };

      // Connect to SSE Stream
      useEffect(() => {
        const es = new EventSource("/api/stream");
        es.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            setState(data);
          } catch (e) {}
        };
        es.onerror = () => {};
        return () => es.close();
      }, []);

      // Auto scroll
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [state.messages]);

      // Actions
      const sendAction = async (payload) => {
        setIsSending(true);
        try {
          await fetch("/api/action", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          playChime(1174, 0.05);
        } catch (e) {}
        setIsSending(false);
      };

      const handleToggleNode = async (action) => {
        try {
          await fetch("/api/node/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action })
          });
          playChime(659, 0.08);
        } catch (e) {}
      };

      const handleRemediate = async (type) => {
        try {
          await fetch("/api/remediate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type })
          });
          playChime(880, 0.08);
        } catch (e) {}
      };

      const handleEndpointSwitch = async (e) => {
        const val = e.target.value;
        const [host, port] = val.split(":");
        if (host && port) {
          await fetch("/api/node/endpoint", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ hub_host: host, rpc_port: parseInt(port) })
          });
        }
      };

      const handleCommandSubmit = (e) => {
        e.preventDefault();
        if (!inputCmd.trim()) return;
        const text = inputCmd.trim();
        setInputCmd("");
        if (targetAgent === "swarm_dev") {
          sendAction({ room: "swarm_dev", message: text });
        } else {
          sendAction({ target: targetAgent, message: text });
        }
      };

      // Filtered messages
      const filteredMessages = (state.messages || []).filter(m => {
        if (filter === "all") return true;
        const s = (m.sender || "").toLowerCase();
        const r = (m.recipient || "").toLowerCase();
        if (filter === "pc") return s.includes("pc") || r.includes("pc");
        if (filter === "phone") return s.includes("phone") || r.includes("phone");
        if (filter === "antigravity") return s.includes("antigravity") || r.includes("antigravity");
        return true;
      });

      const node = state.node_status || {};
      const telem = state.telemetry || {};
      const battery = telem.battery || {};
      const isOnline = node.phone_daemon_running && node.pc_hub_reachable;
      const currentConfig = node.config || {};

      return (
        <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
          {/* Top Matrix Header */}
          <header className="matrix-header">
            <div className="header-brand">
              <span className="brand-glow">⚡ OMNISWARM COCKPIT</span>
              <div className={`status-badge ${isOnline ? "" : "offline"}`}>
                <span className="status-pulse"></span>
                {isOnline ? "ONLINE" : "OFFLINE"}
              </div>
              {node.rtt_ms && (
                <span style={{ color: "var(--cyan-neon)", fontSize: "11px" }}>
                  RTT: {node.rtt_ms}ms
                </span>
              )}
            </div>

            <div className="header-controls">
              <select 
                className="target-select" 
                style={{ fontSize: "11px", padding: "2px 6px" }}
                value={`${currentConfig.hub_host || '192.168.0.111'}:${currentConfig.rpc_port || 5565}`}
                onChange={handleEndpointSwitch}
              >
                <option value="192.168.0.111:5565">Direct LAN (192.168.0.111:5565)</option>
                <option value="bore.pub:33458">Cloud Relay (bore.pub:33458)</option>
              </select>

              {node.phone_daemon_running ? (
                <button className="btn-chip danger" onClick={() => handleToggleNode("stop")}>
                  🔌 Disconnect
                </button>
              ) : (
                <button className="btn-chip primary" onClick={() => handleToggleNode("start")}>
                  ⚡ Connect
                </button>
              )}

              <button className="btn-chip" onClick={() => sendAction({ target: "PCAgent", message: "ping", data: { action: "ping" } })}>
                🚀 Ping PC
              </button>

              <button className="btn-chip" onClick={() => setAudioEnabled(!audioEnabled)}>
                {audioEnabled ? "🔔" : "🔕"}
              </button>
            </div>
          </header>

          {/* Main 3-Column Grid */}
          <main className="cockpit-grid">
            {/* Left Column: Telemetry & Hardware Gauges */}
            <aside className="sidebar-panel">
              <div className="panel-title">
                <span>📊 Edge Vitals (Termux)</span>
                <span>{telem.device_model || "Android"}</span>
              </div>

              <div className="card-vitals">
                <div className="vital-row">
                  <span className="vital-label">SoC Processor:</span>
                  <span className="vital-value" style={{ fontSize: "10px" }}>{telem.soc || "Dimensity 7200"}</span>
                </div>
                {battery.percentage !== undefined && (
                  <>
                    <div className="vital-row" style={{ marginTop: "6px" }}>
                      <span className="vital-label">Battery Level:</span>
                      <span className="vital-value">{battery.percentage}% ({battery.status || "Discharging"})</span>
                    </div>
                    <div className="progress-bar-bg">
                      <div 
                        className={`progress-bar-fill ${battery.percentage > 40 ? 'green' : (battery.percentage > 20 ? 'amber' : 'red')}`} 
                        style={{ width: `${battery.percentage}%` }}
                      ></div>
                    </div>
                    <div className="vital-row" style={{ marginTop: "6px" }}>
                      <span className="vital-label">Battery Temp:</span>
                      <span className="vital-value">{battery.temperature ? (battery.temperature / 10).toFixed(1) : 31.0}°C</span>
                    </div>
                  </>
                )}
                <div className="vital-row" style={{ marginTop: "8px" }}>
                  <span className="vital-label">RAM Usage:</span>
                  <span className="vital-value">{telem.ram_used_percent || 0}%</span>
                </div>
                <div className="progress-bar-bg">
                  <div 
                    className={`progress-bar-fill ${telem.ram_used_percent > 85 ? 'red' : 'green'}`} 
                    style={{ width: `${telem.ram_used_percent || 0}%` }}
                  ></div>
                </div>
                <div className="vital-row" style={{ marginTop: "4px" }}>
                  <span className="vital-label">Available:</span>
                  <span className="vital-value">{telem.ram_available_mb || 0} MB</span>
                </div>
              </div>

              <div className="panel-title" style={{ marginTop: "6px" }}>
                <span>⚡ Quick Remediation</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                <button className="btn-chip" onClick={() => handleRemediate("verify")}>
                  📊 Run verify_install.py
                </button>
                <button className="btn-chip" onClick={() => handleRemediate("git_rebase")}>
                  🔄 Git Pull Rebase
                </button>
                <button className="btn-chip" onClick={() => handleRemediate("clean_cache")}>
                  🧹 Clean System Caches
                </button>
              </div>

              <div className="panel-title" style={{ marginTop: "6px" }}>
                <span>🌐 Mesh Topology</span>
              </div>
              <div className="card-vitals" style={{ fontSize: "11px" }}>
                <div className="vital-row">
                  <span className="vital-label">Edge Node:</span>
                  <span className="vital-value" style={{ color: "var(--green-neon)" }}>PhoneAgent-Termux</span>
                </div>
                <div className="vital-row">
                  <span className="vital-label">Cognitive Brain:</span>
                  <span className="vital-value" style={{ color: "var(--purple-neon)" }}>Antigravity</span>
                </div>
                <div className="vital-row">
                  <span className="vital-label">Coordinator:</span>
                  <span className="vital-value" style={{ color: "var(--cyan-neon)" }}>PCAgent</span>
                </div>
              </div>
            </aside>

            {/* Center Column: Formatted Dialogue Stream */}
            <section className="dialogue-panel">
              <div className="dialogue-filter-bar">
                <span style={{ color: "var(--text-muted)", marginRight: "6px" }}>Filter:</span>
                <button className={`tab-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>All</button>
                <button className={`tab-btn ${filter === 'pc' ? 'active' : ''}`} onClick={() => setFilter('pc')}>PC Agent</button>
                <button className={`tab-btn ${filter === 'phone' ? 'active' : ''}`} onClick={() => setFilter('phone')}>Phone Agent</button>
                <button className={`tab-btn ${filter === 'antigravity' ? 'active' : ''}`} onClick={() => setFilter('antigravity')}>Antigravity</button>
              </div>

              <div className="messages-stream">
                {filteredMessages.length === 0 ? (
                  <div style={{ textAlign: "center", color: "var(--text-muted)", marginTop: "40px", fontFamily: "var(--font-mono)" }}>
                    No messages yet. Waiting for mesh activity...
                  </div>
                ) : (
                  filteredMessages.map((msg, idx) => {
                    const sender = msg.sender || "Unknown";
                    const isPC = sender.includes("PC");
                    const isAGY = sender.includes("Antigravity");
                    const roleClass = isPC ? "pc" : (isAGY ? "antigravity" : "phone");
                    const text = msg.content || msg.message || "";
                    const data = msg.data || msg.metadata?.data || {};

                    return (
                      <div key={msg.id || idx} className={`msg-card ${roleClass}`}>
                        <div className="msg-header">
                          <div className={`msg-sender ${roleClass}`}>
                            <span>{isPC ? "🖥️" : (isAGY ? "🧠" : "📱")}</span>
                            <span>{sender}</span>
                            {msg.recipient && <span style={{ color: "var(--text-muted)", fontWeight: "normal" }}>➔ {msg.recipient}</span>}
                          </div>
                          <span className="msg-time">
                            {msg.timestamp ? new Date(msg.timestamp * 1000).toLocaleTimeString() : ""}
                          </span>
                        </div>

                        <div className="msg-body">{text}</div>

                        {/* Generative UI: Diff Widget */}
                        {data.diff || (text.includes("diff --git") || text.includes("@@")) && (
                          <div className="gen-widget">
                            <div className="gen-widget-header">
                              <span>📄 Git Diff Detected</span>
                            </div>
                            <div className="diff-block">
                              {(data.diff || text).split("\n").map((line, li) => (
                                <div key={li} className={line.startsWith("+") ? "diff-add" : (line.startsWith("-") ? "diff-del" : "")}>
                                  {line}
                                </div>
                              ))}
                            </div>
                            <div className="action-chips-row">
                              <span className="chip-interactive" onClick={() => sendAction({ target: "PCAgent", message: "exec:git commit -m 'Auto-Approved in Cockpit'" })}>
                                ✅ Approve & Commit
                              </span>
                            </div>
                          </div>
                        )}

                        {/* Generative UI: Shell Execution Widget */}
                        {(data.stdout || data.stderr || text.startsWith("Command '")) && (
                          <div className="gen-widget">
                            <div className="gen-widget-header">
                              <span>🖥️ Shell Output {data.returncode !== undefined ? `(Exit: ${data.returncode})` : ""}</span>
                              <span>{data.success ? "✅ SUCCESS" : "⚠️ FAILED"}</span>
                            </div>
                            <div className="terminal-block">
                              {data.stdout || data.stderr || "Output logged."}
                            </div>
                            <div className="action-chips-row">
                              <span className="chip-interactive" onClick={() => navigator.clipboard.writeText(data.stdout || text)}>
                                📋 Copy Output
                              </span>
                              <span className="chip-interactive" onClick={() => sendAction({ target: "PhoneAgent-Termux", message: "exec:git status -s" })}>
                                📊 Check Git Status
                              </span>
                            </div>
                          </div>
                        )}

                        {/* Generative UI: Smart Action Suggestions */}
                        <div className="action-chips-row">
                          <span className="chip-interactive" onClick={() => sendAction({ target: sender, message: "health", data: { action: "health_check" } })}>
                            ▶ Query Health
                          </span>
                          <span className="chip-interactive" onClick={() => sendAction({ target: sender, message: "ping", data: { action: "ping" } })}>
                            ▶ Ping Node
                          </span>
                        </div>
                      </div>
                    );
                  })
                )}
                <div ref={messagesEndRef} />
              </div>
            </section>

            {/* Right Column: Workflows & Live Ops Stream */}
            <aside className="right-panel">
              {/* Active Workflow */}
              <div className="workflow-section">
                <div className="panel-title">
                  <span>⚡ Active Workflow Intent</span>
                </div>
                {state.workflow ? (
                  <div className="workflow-card">
                    <span className={`workflow-status status-${state.workflow.status || 'pending'}`}>
                      {state.workflow.status || "Pending"}
                    </span>
                    <div style={{ fontSize: "12px", fontWeight: "600", marginBottom: "4px" }}>
                      {state.workflow.intent || "No active intent description"}
                    </div>
                    <div style={{ fontSize: "11px", color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
                      Task ID: {state.workflow.task_id || "N/A"}<br/>
                      Source: {state.workflow.source || "PCAgent"}
                    </div>
                  </div>
                ) : (
                  <div style={{ fontSize: "12px", color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
                    No pending workflows in workflow.json
                  </div>
                )}
              </div>

              {/* Real-time Ops Stream */}
              <div className="ops-section">
                <div className="panel-title">
                  <span>🖥️ Real-time Ops Stream</span>
                  <span>{state.logs?.length || 0} entries</span>
                </div>
                <div className="ops-stream">
                  {(state.logs || []).map((l, i) => (
                    <div key={l.id || i} className="log-line">
                      <span className={`log-level-${l.log_level || l.level || 'INFO'}`}>
                        [{l.log_level || l.level || 'INFO'}]
                      </span>
                      <span style={{ color: "var(--text-muted)" }}>[{l.agent_id}]</span>
                      <span style={{ color: "var(--text-primary)" }}>{l.message}</span>
                    </div>
                  ))}
                  <div ref={logsEndRef} />
                </div>
              </div>
            </aside>
          </main>

          {/* Bottom Command Bar */}
          <footer className="command-bar">
            <select 
              className="target-select" 
              value={targetAgent} 
              onChange={(e) => setTargetAgent(e.target.value)}
            >
              <option value="PCAgent">Target: PCAgent</option>
              <option value="PhoneAgent-Termux">Target: PhoneAgent</option>
              <option value="Antigravity">Target: Antigravity Brain</option>
              <option value="swarm_dev">Room: swarm_dev</option>
            </select>

            <form onSubmit={handleCommandSubmit} style={{ display: "flex", flex: 1, gap: "8px" }}>
              <input
                type="text"
                className="cmd-input"
                placeholder="Enter directive (e.g. 'health', 'exec:uptime', 'git status', 'task:review PR')..."
                value={inputCmd}
                onChange={(e) => setInputCmd(e.target.value)}
              />
              <button type="submit" className="send-btn" disabled={isSending}>
                {isSending ? "Sending..." : "🚀 SEND"}
              </button>
            </form>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<CockpitApp />);
  </script>
</body>
</html>
